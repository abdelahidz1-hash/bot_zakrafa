<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة سوداء</title>
    <style>
        /* إعدادات الخلفية السوداء بالكامل */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* التعديل هنا: وضع المحتوى في الأعلى بدلاً من المنتصف */
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* الحاوية الرئيسية للتطبيق */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* التعديل هنا: محاذاة العناصر من الأعلى */
            align-items: center;
            gap: 20px;
            padding-top: 40px; /* مسافة بسيطة من أعلى الشاشة */
        }

        /* حاوية المربعات الثلاثة */
        .boxes-wrapper {
            display: flex;
            gap: 25px; /* التعديل هنا: زيادة المسافة بين المربعات */
            flex-wrap: wrap; /* للسماح بنزول المربعات الإضافية للسطر التالي إذا لزم الأمر */
            justify-content: center;
            max-width: 360px;
        }

        /* تصميم المربعات بحجم أصغر وفرق بينهما */
        .small-box {
            width: 55px;  /* التعديل هنا: تصغير حجم المربع إلى 55px */
            height: 55px;
            background-color: #1a1a1a; /* لون رمادي داكن يبرز فوق الأسود */
            border: none; /* إزالة الحدود القديمة */
            background-image: url('https://raw.githubusercontent.com/0xme/ff-resources/refs/heads/main/pngs/300x300/FF_UI_Prime_AvatarFrame.png'); /* وضع إطار الصورة الجديد كخلفية للإطار */
            background-size: 100% 100%; /* جعل الإطار يغطي المربع بالكامل */
            background-repeat: no-repeat;
            border-radius: 12px; /* تعديل طفيف للأركان الدائرية لتناسب الحجم */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s ease;
            overflow: hidden; /* لضمان عدم خروج الصورة عن الأركان الدائرية للمربع */
            position: relative;
            cursor: pointer;
        }

        /* تأثير خفيف عند لمس المربع */
        .small-box:active {
            background-color: #333333;
        }

        /* تنسيق الصورة داخل المربعات */
        .small-box img.avatar-img {
            position: absolute; /* جعل الصورة تأخذ وضعية الخلفية وراء الإطار */
            width: 75%; /* ضبط الحجم لكي تختبئ تحت الإطار بشكل مناسب */
            height: 75%;
            object-fit: cover;
            border-radius: 0; /* جعل الصورة بدون أركان دائرية */
            z-index: 1; /* وضعها في طبقة خلفية */
        }

        /* تنسيق الشارة الجديدة بجانب الإطار داخل الأيقونة بحجم 25% */
        .small-box img.badge-img {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 25%;
            height: 25%;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        /* ضمان ظهور الإطار فوق الصورة */
        .small-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: inherit;
            background-size: inherit;
            background-repeat: inherit;
            z-index: 2; /* وضع الإطار في طبقة أمامية فوق الصورة */
            pointer-events: none;
        }

        /* تنسيق اللافتة الكبيرة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #111;
            border: 1px solid #333;
            width: 85%;
            max-width: 320px;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            color: #fff;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffcc00;
            text-align: center;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }
        .info-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .info-row span.label {
            color: #888;
            font-size: 12px;
        }
        .info-row span.value {
            color: #fff;
            word-break: break-all;
            font-family: monospace;
        }
        .close-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 5px;
        }
        .close-btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <!-- اللافتة الكبيرة (Modal) لعرض معلومات الحساب -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <h3>معلومات الحساب</h3>
            <div class="info-row">
                <span class="label">USER NAME</span>
                <span id="modalUser" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">PASSWORD</span>
                <span id="modalPass" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">TOKEN ACCOUNT</span>
                <span id="modalToken" class="value">-</span>
            </div>
            <button class="close-btn" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        let accountsData = [];

        async function loadAccountsFile() {
            try {
                const response = await fetch('account.vip.txt');
                const text = await response.text();
                parseAccounts(text);
            } catch (error) {
                // بيانات افتراضية بالتنسيق الجديد في حال لم يتم رفع الملف محلياً بعد
                const fallbackText = `
1: USER NAME: Venom_DZ_1 . PASSWORD: pass_001_secure . TOKEN: tok_live_998123746501
2: USER NAME: Venom_DZ_2 . PASSWORD: pass_002_secure . TOKEN: tok_live_887234651902
3: USER NAME: Venom_DZ_3 . PASSWORD: pass_003_secure . TOKEN: tok_live_776345762803
4: USER NAME: Venom_DZ_4 . PASSWORD: pass_004_secure . TOKEN: tok_live_665456873704
5: USER NAME: Venom_DZ_5 . PASSWORD: pass_005_secure . TOKEN: tok_live_554567984605
6: USER NAME: Venom_DZ_6 . PASSWORD: pass_006_secure . TOKEN: tok_live_443678095506
7: USER NAME: Venom_DZ_7 . PASSWORD: pass_007_secure . TOKEN: tok_live_332789106407
8: USER NAME: Venom_DZ_8 . PASSWORD: pass_008_secure . TOKEN: tok_live_221890217308
                `;
                parseAccounts(fallbackText);
            }
        }

        function parseAccounts(dataText) {
            const lines = dataText.split(/\r?\n/).filter(line => line.trim() !== '');
            accountsData = lines.map(line => {
                const userMatch = line.match(/USER\s*NAME[:\s]+([^.]+)/i);
                const passMatch = line.match(/PASSWORD[:\s]+([^.]+)/i);
                const tokenMatch = line.match(/TOKEN(?:_ACCOUNT)?[:\s]+([^\r\n]+)/i);

                return {
                    username: userMatch ? userMatch[1].trim() : 'غير متوفر',
                    password: passMatch ? passMatch[1].trim() : 'غير متوفر',
                    token: tokenMatch ? tokenMatch[1].trim() : 'غير متوفر'
                };
            });
        }

        const boxes = document.querySelectorAll('.small-box');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalUser = document.getElementById('modalUser');
        const modalPass = document.getElementById('modalPass');
        const modalToken = document.getElementById('modalToken');

        boxes.forEach((box, index) => {
            box.addEventListener('click', () => {
                const acc = accountsData[index] || {
                    username: 'Venom_DZ_' + (index + 1),
                    password: 'Protected_Password_' + (index + 1),
                    token: 'tok_default_' + Math.random().toString(36).substring(2)
                };

                modalUser.textContent = acc.username;
                modalPass.textContent = acc.password;
                modalToken.textContent = acc.token;

                modalOverlay.classList.add('show');
            });
        });

        function closeModal() {
            modalOverlay.classList.remove('show');
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        loadAccountsFile();
    </script>

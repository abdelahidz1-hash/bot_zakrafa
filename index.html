<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET AN FREE ACCOUNT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .store-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .app-card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .app-card:hover {
            transform: translateY(-5px);
            background-color: #2c2c2c;
        }

        /* تنسيق الصورة بدلاً من أسماء التطبيقات */
        .app-image-container {
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-image-container img {
            max-height: 100%;
            max-width: 100%;
            border-radius: 8px;
            object-fit: contain;
        }

        /* تنسيق الأيقونات الجديدة بدلاً من زر التثبيت */
        .actions-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        .action-icon {
            width: 26px;
            height: 26px;
            cursor: pointer;
            object-fit: contain;
            transition: transform 0.2s ease, opacity 0.2s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .action-icon:hover {
            transform: scale(1.15);
            opacity: 0.85;
        }

        /* تنسيق زر الحذف الإضافي */
        .delete-btn {
            display: none;
            margin-top: 10px;
            width: 100%;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .delete-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <header>
        <h1>GET AN FREE ACCOUNT</h1>
    </header>

    <div class="store-container" id="storeContainer">
        <!-- سيتم توليد البطاقات ديناميكياً هنا -->
    </div>

    <script>
        // دالة للحصول على معرف فريد للجهاز أو إنشاؤه وتخزينه
        function getDeviceId() {
            let deviceId = localStorage.getItem('device_unique_id');
            if (!deviceId) {
                deviceId = 'device_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('device_unique_id', deviceId);
            }
            return deviceId;
        }

        // دالة لخصم النقاط من قاعدة بيانات Firebase
        async function deductPoints(actionType, username, password) {
            const deviceId = getDeviceId();
            const safeDeviceId = deviceId.replace(/[^a-zA-Z0-9_-]/g, '_');
            const firebaseUrl = `https://ff-2022-633ed-default-rtdb.firebaseio.com/devices/${safeDeviceId}/points.json`;

            try {
                const response = await fetch(firebaseUrl);
                let currentPoints = await response.json();

                if (currentPoints === null) {
                    currentPoints = 500; // رصيد افتراضي للاختبار
                }

                if (currentPoints < 120) {
                    alert('عذراً، رصيدك غير كافٍ! تحتاج إلى 120 نقطة على الأقل.');
                    return false;
                }

                const newPoints = currentPoints - 120;

                const updateResponse = await fetch(firebaseUrl, {
                    method: 'PUT',
                    body: JSON.stringify(newPoints)
                });

                if (updateResponse.ok) {
                    if (actionType === 'show') {
                        const accountInfo = `اسم المستخدم: ${username}\nكلمة المرور: ${password}`;
                        navigator.clipboard.writeText(accountInfo).then(() => {
                            alert(`تم خصم 120 نقطة بنجاح.\nتم نسخ معلومات الحساب إلى الحافظة!\n\n${accountInfo}`);
                        }).catch(() => {
                            alert(`تم خصم 120 نقطة بنجاح.\nاسم المستخدم: ${username}\nكلمة المرور: ${password}`);
                        });
                    } else {
                        alert(`تم خصم 120 نقطة بنجاح لشراء الحساب!`);
                    }
                    return true;
                } else {
                    alert('حدث خطأ أثناء تحديث النقاط، يرجى المحاولة مرة أخرى.');
                    return false;
                }
            } catch (error) {
                console.error('خطأ في الاتصال بقاعدة البيانات:', error);
                alert('فشل الاتصال بالخادم.');
                return false;
            }
        }

        // قائمة الحسابات مباشرة (يمكنك إدراج حساباتك هنا بسهولة تامة)
        const accountsData = `
        Abdullah,123123147147,https://i.ibb.co/fVBvNmpm/924eb361-30d6-4a98-bc0f-82c8c33836a5.jpg
        `;

        function loadStore() {
            const container = document.getElementById('storeContainer');
            container.innerHTML = '';
            
            const lines = accountsData.split('\n');
            lines.forEach((line, index) => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return;
                
                const parts = trimmedLine.split(',');
                if (parts.length >= 3) {
                    const username = parts[0].trim();
                    const password = parts[1].trim();
                    const iconUrl = parts[2].trim();
                    const cardId = 'card_' + index;
                    
                    if (localStorage.getItem('hidden_' + username)) {
                        return; // إخفاء الحساب إذا تم استخدامه مسبقاً من هذا المتصفح
                    }

                    if (username && password && iconUrl) {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        card.id = cardId;
                        card.innerHTML = `
                            <div class="app-image-container">
                                <img src="${iconUrl}" alt="Account Image">
                            </div>
                            <div class="actions-container">
                                <input type="image" src="https://images.icon-icons.com/2065/PNG/96/view_show_icon_124811.png" alt="إظهار كلمة المرور" class="action-icon show-btn" data-username="${username}" data-password="${password}" data-action="show">
                                <input type="image" src="https://images.icon-icons.com/1580/PNG/96/2849824-basket-buy-market-multimedia-shop-shopping-store_107977.png" alt="شراء" class="action-icon buy-btn" data-username="${username}" data-password="${password}" data-action="buy">
                            </div>
                            <button class="delete-btn">حذف الحساب</button>
                        `;
                        
                        const showIcon = card.querySelector('.show-btn');
                        const buyIcon = card.querySelector('.buy-btn');
                        const deleteBtn = card.querySelector('.delete-btn');

                        showIcon.addEventListener('click', async function() {
                            const action = this.getAttribute('data-action');
                            const u = this.getAttribute('data-username');
                            const p = this.getAttribute('data-password');
                            const success = await deductPoints(action, u, p);
                            if (success) {
                                deleteBtn.style.display = 'block';
                                showIcon.style.display = 'none';
                            }
                        });

                        buyIcon.addEventListener('click', async function() {
                            const action = this.getAttribute('data-action');
                            const u = this.getAttribute('data-username');
                            const p = this.getAttribute('data-password');
                            const success = await deductPoints(action, u, p);
                            if (success) {
                                const accountInfo = `اسم المستخدم: ${u}\nكلمة المرور: ${p}`;
                                navigator.clipboard.writeText(accountInfo).catch(() => {});
                                deleteBtn.style.display = 'block';
                                buyIcon.style.display = 'none';
                            }
                        });

                        deleteBtn.addEventListener('click', function() {
                            localStorage.setItem('hidden_' + username, 'true');
                            card.style.transition = 'opacity 0.3s ease';
                            card.style.opacity = '0';
                            setTimeout(() => {
                                card.remove();
                            }, 300);
                        });

                        container.appendChild(card);
                    }
                }
            });
        }

        // تشغيل التحميل عند فتح الصفحة
        loadStore();
    </script>

</body>
    </html>
